<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
         align-items: center; justify-content: center; background: #f4ecd8;
         color: #2b2b2b; font-family: Georgia, serif; text-align: center; }
  h1 { font-size: 7rem; margin: 0; letter-spacing: 0.2rem; }
  .quote { font-size: 1.8rem; font-style: italic; margin: 0.5rem 1rem 0.3rem; }
  .sub { margin: 0 1rem 1.5rem; color: #6b6b6b; }
  a { color: #7a2e2e; text-decoration: none; border-bottom: 2px solid #7a2e2e; }
  .smoke circle { fill: #9aa5b1; opacity: 0; transform-box: fill-box;
                  transform-origin: center; animation: rise 4s ease-in infinite; }
  .smoke circle:nth-child(2) { animation-delay: 1.3s; }
  .smoke circle:nth-child(3) { animation-delay: 2.6s; }
  @keyframes rise {
    0% { opacity: 0.7; transform: translate(0, 0) scale(0.5); }
    100% { opacity: 0; transform: translate(25px, -90px) scale(2); }
  }
</style>
</head>
<body>
<svg width="260" height="200" viewBox="0 0 260 200" role="img" aria-label="Une pipe">
  <g class="smoke">
    <circle cx="70" cy="90" r="10"/>
    <circle cx="70" cy="90" r="10"/>
    <circle cx="70" cy="90" r="10"/>
  </g>
  <rect x="40" y="100" width="60" height="60" rx="12" fill="#5b3a29"/>
  <ellipse cx="70" cy="100" rx="26" ry="7" fill="#2b1a10"/>
  <path d="M100 140 C150 140 160 170 220 165" stroke="#5b3a29"
        stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M208 166 L226 164" stroke="#1d120b" stroke-width="14"
        stroke-linecap="round"/>
</svg>
<h1>404</h1>
<p class="quote">Ceci n'est pas une page</p>
<p class="sub">Cette adresse n'existe pas, comme cette pipe n'est pas une pipe.</p>
<a href="/">Retour &agrave; l'accueil</a>
</body>
</html>
